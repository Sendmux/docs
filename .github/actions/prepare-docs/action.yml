name: Prepare and verify docs
description: Install the docs tooling and run its credential-free release checks.

runs:
  using: composite
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
      with:
        node-version: 22.23.4
        cache: npm

    - name: Read MCP SDK pin
      id: mcp-sdk
      shell: bash
      run: |
        commit="$(node scripts/read-mcp-docs-sdk-pin.mjs)"
        printf 'commit=%s\n' "$commit" >> "$GITHUB_OUTPUT"

    - name: Checkout pinned MCP SDK source
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        persist-credentials: false
        repository: qubrics/qubrics-sdk
        ref: ${{ steps.mcp-sdk.outputs.commit }}
        path: .tmp/mcp-docs-sdk

    - name: Checkout approved Skills main
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        persist-credentials: false
        repository: qubrics/skills
        ref: c4e01f547b32591b658844da8d65b54da86554aa
        path: .tmp/skills-main
        fetch-depth: 0

    - name: Verify Skills main acceptance
      shell: bash
      env:
        SKILLS_REVISION: c4e01f547b32591b658844da8d65b54da86554aa
      run: |
        set -euo pipefail
        node .tmp/skills-main/scripts/skill-compatibility.mjs --verify-skills-receipt evidence/rebrand-qubrics-skills-main-c4e01f54.acceptance.json \
          --skills-root "$GITHUB_WORKSPACE/.tmp/skills-main" --revision "$SKILLS_REVISION"

    - name: Install dependencies
      shell: bash
      run: npm ci

    - name: Tooling tests
      shell: bash
      run: npm test
      env:
        SENDMUX_SDK_CHECKOUT: .tmp/mcp-docs-sdk
        SENDMUX_SKILLS_ROOT: .tmp/skills-main

    - name: MCP docs contract drift
      shell: bash
      run: npm run mcp-docs:check
      env:
        SENDMUX_SDK_CHECKOUT: .tmp/mcp-docs-sdk

    - name: External link safety
      shell: bash
      run: npm run external-links:check

    - name: Postman collection drift
      shell: bash
      run: npm run postman:check

    - name: MCP discovery contract
      shell: bash
      run: npm run mcp-discovery:check
