name: Publish hosted Postman collections

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-postman-publication
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production-postman
    steps:
      - name: Checkout exact dispatch commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Verify protected production context
        env:
          POSTMAN_PUBLISH_PROTECTED: ${{ vars.POSTMAN_PUBLISH_PROTECTED }}
        run: |
          test "$POSTMAN_PUBLISH_PROTECTED" = "true"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git fetch --no-tags --depth=1 origin main
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA"

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify publication source
        run: |
          npm test
          npm run external-links:check
          npm run postman:check

      - name: Publish with backup, readback, and automatic rollback
        env:
          POSTMAN_API_KEY: ${{ secrets.POSTMAN_PRODUCTION_API_KEY }}
        run: npm run postman:hosted:sync

      - name: Independent hosted readback
        env:
          POSTMAN_API_KEY: ${{ secrets.POSTMAN_PRODUCTION_API_KEY }}
        run: npm run postman:hosted:check

      - name: Preserve publication evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: postman-publication-${{ github.run_id }}
          path: .tmp/postman-hosted*
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30
