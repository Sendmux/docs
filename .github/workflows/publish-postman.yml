name: Publish hosted Postman collections

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-postman-publication
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production-postman
    steps:
      - name: Checkout exact dispatch commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify protected production context
        env:
          GITHUB_TOKEN: ${{ github.token }}
          POSTMAN_PUBLISH_PROTECTED: ${{ vars.POSTMAN_PUBLISH_PROTECTED }}
        run: |
          test "$POSTMAN_PUBLISH_PROTECTED" = "true"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          response="$(mktemp)"
          trap 'rm -f "$response"' EXIT
          curl --fail-with-body --silent --show-error \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GITHUB_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --output "$response" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/commits/main"
          main_sha="$(node -e '
            const response = JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8"));
            if (!/^[0-9a-f]{40}$/.test(response.sha)) throw new Error("GitHub main response did not contain a complete commit ID");
            process.stdout.write(response.sha);
          ' "$response")"
          test "$main_sha" = "$GITHUB_SHA"

      - name: Prepare and verify publication source
        uses: ./.github/actions/prepare-docs

      - name: Publish with backup, readback, and automatic rollback
        env:
          POSTMAN_API_KEY: ${{ secrets.POSTMAN_PRODUCTION_API_KEY }}
        run: npm run postman:hosted:sync

      - name: Independent hosted readback
        env:
          POSTMAN_API_KEY: ${{ secrets.POSTMAN_PRODUCTION_API_KEY }}
        run: npm run postman:hosted:check

      - name: Preserve publication evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: postman-publication-${{ github.run_id }}
          path: .tmp/postman-hosted*
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30
