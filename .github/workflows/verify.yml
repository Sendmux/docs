name: Verify docs

# Hard gates:
# - Non-Sendmux external MDX links must be SEO-safe nofollow links.
# - Committed Postman collections must match the generated OpenAPI output.

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    name: Docs gates
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Prepare and verify docs
        uses: ./.github/actions/prepare-docs
